name: Cancer evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check claim, source, and matrix references
        run: node scripts/check-evidence.mjs
      - name: Install site dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check public content and refusal tests
        run: npm run check:content && npm run check:suits && npm test
      - name: Build public projection
        run: npm run build
      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.57.0

      - name: Exercise generated public site in mobile Chrome
        run: node scripts/check-public-mobile-browser.cjs

      - name: Save mobile screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researchthat-public-mobile-${{ github.run_id }}
          path: artifacts/public-phone-mobile.png
          if-no-files-found: ignore

      - name: Check current ResearchThat public carrier and refusals
        run: python3 scripts/test_researchthat_pages.py && python3 scripts/build-researchthat-pages.py
