name: Cancer evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check claim, source, and matrix references
        run: node scripts/check-evidence.mjs
