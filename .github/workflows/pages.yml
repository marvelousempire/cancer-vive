name: Deploy ResearchThat public copy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Check public content and refusal tests
        run: npm run check:content && npm run check:suits && npm test
      - name: Check the sealed ResearchThat public copy
        run: python3 scripts/test_researchthat_pages.py

      - name: Build the current ResearchThat public copy
        run: npm run build

      - name: Install browser test driver
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.57.0

      - name: Exercise generated public site in mobile Chrome
        run: node scripts/check-public-mobile-browser.cjs

      - name: Save mobile screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researchthat-public-mobile-${{ github.run_id }}
          path: artifacts/public-phone-mobile.png
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify_live:
    name: Verify public website (separate from Pages deployment)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v6

      - name: Verify published HTML, assets, and public-only data
        id: live
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify-live-pages.py --url "https://marvelousempire.github.io/cancer-vive/" --attempts 18 --delay 5 2>&1 | tee live-pages-verification.log

      - name: Record the exact live verification outcome
        if: always()
        shell: bash
        run: |
          {
            echo '## Cancer Vive public website verification'
            echo "Source commit: \`$GITHUB_SHA\`"
            echo "GitHub Pages deployment job: \`${{ needs.deploy.result }}\`"
            echo "Live website check: \`${{ steps.live.outcome }}\`"
            echo 'A successful Pages deployment and a successful live verification are different results.'
            echo ''
            echo '### Last live verification output'
            echo '```'
            tail -n 25 live-pages-verification.log 2>/dev/null || echo 'Verification did not start'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  report_release:
    name: Record Pages result in tracking issue
    if: always()
    runs-on: ubuntu-latest
    needs: [build, deploy, verify_live]
    permissions:
      issues: write
    steps:
      - name: Report exact build, deploy, and live status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const states = {
              build: '${{ needs.build.result }}',
              deploy: '${{ needs.deploy.result }}',
              live: '${{ needs.verify_live.result }}'
            };
            const status = states.build === 'success' && states.deploy === 'success' && states.live === 'success'
              ? 'Live HTTP files verified (phone usability still separate)'
              : 'NOT fully live verified';
            const body = [
              '## Automated public Pages release readback',
              '',
              'Commit: \`${{ github.sha }}\`',
              'Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              '',
              '| Stage | Actual GitHub Actions result |',
              '| --- | --- |',
              '| Build and generated-mobile Chrome test | ' + states.build + ' |',
              '| GitHub Pages deployment | ' + states.deploy + ' |',
              '| Public URL HTML/asset readback | ' + states.live + ' |',
              '',
              '**Overall: ' + status + '.**',
              'A green HTTP readback does not replace a real phone visual review.',
              'If a stage failed, open the linked run and read its failed step and log.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: 10, body
            });
