# Gitea runs the same evidence and build checks with its Node 20 action runtime.
# GitHub keeps its own workflows, including the Pages deployment.
name: Cancer evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check claim, source, and matrix references
        run: node scripts/check-evidence.mjs
      - name: Install site dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Check public content and refusal tests
        run: npm run check:content && npm test
      - name: Build public projection
        run: npm run build
