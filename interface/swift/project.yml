name: CancerViveNative
options:
  bundleIdPrefix: ai.marvelousempire.cancervive
  deploymentTarget:
    macOS: "13.0"
settings:
  MARKETING_VERSION: 0.15.0
  CURRENT_PROJECT_VERSION: 10
  SWIFT_VERSION: "5.0"
  ENABLE_HARDENED_RUNTIME: YES
packages:
  FatherConsoleContracts:
    path: ../../vendor/framework-native-apple/packages/swift-console
targets:
  CancerViveNative:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    preBuildScripts:
      - name: Refresh study notes
        script: |
          cd "$SRCROOT/../.."
          node scripts/prepare-apple.mjs --write
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../..
        outputFiles:
          - $(SRCROOT)/Resources
          - $(SRCROOT)/Sources/GeneratedMessages.swift
    dependencies:
      - package: FatherConsoleContracts
        product: FatherConsoleContracts
      - package: FatherConsoleContracts
        product: FatherNativeConsole
    settings:
      PRODUCT_NAME: Cancer Vive Native
      PRODUCT_BUNDLE_IDENTIFIER: ai.marvelousempire.cancervive.native
      CODE_SIGN_IDENTITY: "-"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Cancer Vive Native
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: icon.png
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
